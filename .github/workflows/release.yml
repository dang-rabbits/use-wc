name: Release
on:
  push:
    branches:
      - main
      - next
      - alpha
      - beta
      - pre
      - rc

permissions:
  id-token: write
  contents: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          cache: true
      - name: Bundle library
        run: vp run build
      - name: Verify the integrity of provenance attestations and registry signatures for installed dependencies
        run: vp pm audit -- signatures
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: vp exec semantic-release
      - name: Point latest at the newest prerelease
        if: github.ref_name == 'pre'
        run: vp pm dist-tag add "use-wc@$(vp pm view use-wc dist-tags.pre)" latest
