name: use-wc
icon: null
processes:
  "Analyze web components":
    command: vp run analyze
    working_dir: null
    auto_start: false
    auto_restart: false
    restart_when_changed: []
    env: {}
  "Test":
    command: vp test --watch
    working_dir: null
    auto_start: true
    auto_restart: false
    restart_when_changed: []
    env: {}
  "Check":
    command: vp check
    working_dir: null
    auto_start: false
    auto_restart: false
    restart_when_changed: []
    env: {}
  "Fix":
    command: vp check --fix
    working_dir: null
    auto_start: false
    auto_restart: false
    restart_when_changed: []
    env: {}
  Storybook:
    command: vp run storybook
    working_dir: null
    auto_start: true
    auto_restart: false
    restart_when_changed: []
    env: {}
  "Pack":
    command: vp build
    working_dir: null
    auto_start: false
    auto_restart: false
    restart_when_changed: []
    env: {}
  "Coverage":
    command: vp test --coverage
    working_dir: null
    auto_start: false
    auto_restart: false
    restart_when_changed: []
    env: {}
