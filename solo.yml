    command: npm run analyze
    working_dir: null
    auto_start: false
    auto_restart: false
    restart_when_changed: []
    env: {}
  Storybook:
    command: npm run storybook
    working_dir: null
    auto_start: true
    auto_restart: false
    restart_when_changed: []
    env: {}
