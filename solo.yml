name: use-wc
icon: null
processes:
  'npm: build':
    command: npm run build
    working_dir: null
    auto_start: false
    auto_restart: false
    restart_when_changed: []
    env: {}
  'npm: test':
    command: npm run test
    working_dir: null
    auto_start: true
    auto_restart: false
